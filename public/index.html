<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sonyunseong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300..700&display=swap" rel="stylesheet">
<!-- 한글: Roboto Mono에 한글이 없어서 깔끔한 Noto Sans KR로 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300..700&display=swap" rel="stylesheet">
<!-- 숫자만 가운데 빗금 없는 0을 쓰려고 Roboto의 숫자만 불러옴 -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300..500&text=0123456789&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #B9BABD;
  --thumb-radius: 3px; /* 미리보기 모서리: 아주 살짝 둥글게 (실험) */      /* PANTONE 14-4107 Quiet Gray */
  --white: #FFFFFF;
  --black: #000000;
  --font: "Roboto Mono", "Noto Sans KR", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--black);
  font-family: var(--font);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 1px solid var(--black); outline-offset: 4px; }

/* ── 가운데 위 메뉴 ── */
.menu {
  position: fixed;
  top: 28px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  transition: top .35s ease, transform .35s ease;
}
/* 첫 화면: 별을 화면 정중앙에 */
body.is-home .menu { top: 50%; transform: translate(-50%, -50%); }
@media (prefers-reduced-motion: reduce) { .menu { transition: none; } }
.menu-toggle { display: block; line-height: 0; }
.star { display: block; transition: transform .35s ease; }
.menu.open .star { transform: rotate(72deg); }
/* 별 양옆으로 펼쳐짐: 왼쪽 Drawing, 오른쪽 Info */
.menu-list {
  list-style: none;
  margin: 0;
  padding: 0;
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.menu-list li {
  position: absolute;
  top: 50%;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transition: opacity .3s ease, transform .35s ease, visibility 0s linear .35s;
}
.menu-list li:first-child { right: calc(100% + 22px); transform: translate(18px, -50%); }
.menu-list li:last-child  { left:  calc(100% + 22px); transform: translate(-18px, -50%); }
.menu.open .menu-list li {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate(0, -50%);
  transition: opacity .3s ease .05s, transform .35s ease, visibility 0s;
}
@media (prefers-reduced-motion: reduce) {
  .star, .menu-list li, .menu.open .menu-list li { transition: none; }
}
.menu-list a { color: var(--black); text-decoration: none; font-size: 15px; font-weight: 430; letter-spacing: 0.1em; margin-right: -0.1em; /* 마지막 글자 뒤 자간을 빼서 좌우 간격을 똑같이 */ }
.menu-list a:hover, .menu-list a[aria-current="page"] { text-decoration: underline; text-underline-offset: 4px; }

/* 첫 화면 그림자: 화면 전체를 고르게 살짝 어둡게 덮어서 흰 별이 더 도드라지게 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background: rgba(0, 0, 0, 0.22);
  opacity: 0;
  transition: opacity .6s ease;
}
body.is-home::before { opacity: 1; }
@media (prefers-reduced-motion: reduce) { body::before { transition: none; } }

/* ── 화면 ── */
.view { display: none; }
.view.active { display: block; }

/* Drawing: 한 줄에 두 장 */
.drawing {
  max-width: 1100px;
  margin: 0 auto;
  padding: 140px 24px 80px;
}
/* Draw: 미리보기 3장을 한 줄로 (Girl 시리즈 · Plein air 01 · Portrait 01)
   Girl 시리즈 화면: 한 줄에 두 장씩 두 줄.
   미리보기는 모두 같은 크기(3:4), 가운데 기준으로 잘라서 보여줌. 크게 보면 그림 전체 */
.rows { display: grid; column-gap: 20px; row-gap: 28px; }
.rows-3 { grid-template-columns: repeat(3, 1fr); }
.rows-2 { grid-template-columns: repeat(2, 1fr); }
.drawing.series-view { max-width: 820px; } /* 두 장씩이라 폭을 줄여서 그림이 너무 커지지 않게 */
.drawing.series-view.series-wide { max-width: 1100px; } /* 한 줄에 세 장인 시리즈 화면 */

/* 시리즈 미리보기: 뒤에 종이가 두 장 더 겹쳐 있는 것처럼 보여서 '묶음'이라는 걸 알려줌 */
.series { display: block; position: relative; cursor: pointer; isolation: isolate; }
.series::before, .series::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--thumb-radius);
  z-index: -1;
}
.series::before { background: #DADADA; transform: translate(5px, -5px); }
.series::after  { background: #CBCBCB; transform: translate(10px, -10px); z-index: -2; }
.series img { display: block; width: 100%; aspect-ratio: 3 / 4; height: auto; object-fit: cover; border-radius: var(--thumb-radius); transition: transform .35s ease; }
.series:hover img { transform: translate(-2px, 2px); }
.series:focus, .series:focus-visible { outline: none; }

/* 시리즈가 열릴 때 그림들이 차례로 주르륵 떠오름 */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.series-view.active:not(.from-cover) .work { animation: rise .45s ease both; animation-delay: calc(var(--i, 0) * 80ms); } /* 링크로 바로 들어왔을 때 */
.series-view .work { transform-origin: 0 0; }
.series-view .work:first-child { position: relative; z-index: 1; } /* 모여들 때 표지 그림이 맨 위에 */
/* 시리즈에서 Draw로 돌아올 때: 돌아온 시리즈 표지 말고 나머지가 은은하게 나타남 */
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
#view-drawing.enter .rows > *:not(.from) { animation: fadein .3s ease both; }
#view-drawing.enter .series.from::before, #view-drawing.enter .series.from::after { animation: fadein .3s ease both; }
@media (prefers-reduced-motion: reduce) { .series-view.active .work { animation: none; } }
.work {
  min-width: 0;
  display: block;
  cursor: zoom-in;
}
.work img { display: block; width: 100%; aspect-ratio: 3 / 4; height: auto; object-fit: cover; border-radius: var(--thumb-radius); }
.work:focus, .work:focus-visible { outline: none; } /* 닫은 뒤 생기던 검은 테두리 없앰 */

/* 그림 크게 보기: 그 그림만 */
.viewer {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  place-items: center;
  padding: 48px 24px 32px; /* 위쪽은 제목 자리 */
  cursor: zoom-out;
}
.viewer.open { display: grid; }
.viewer:focus { outline: none; }
.viewer { touch-action: none; overflow: hidden; } /* 확대 · 이동 · 넘기기를 모두 사이트가 직접 처리 */
.viewer img.zoomed { cursor: grab; }
.viewer img { backface-visibility: hidden; }
.viewer-bg { position: absolute; inset: 0; background: var(--bg); }
/* 확대 화면에서만 보이는 제목: 그림 왼쪽 위, 그림에서 살짝 띄워서 (위치는 스크립트가 그림에 맞춰 잡음) */
.viewer-title {
  position: absolute;
  top: 0;
  left: 0;
  line-height: 1;
  margin: 0;
  font-size: 15px;
  font-weight: 430; /* 메뉴(360)보다 조금 두껍게 */
  letter-spacing: 0.1em;
  color: var(--black);
  opacity: 0;
  transition: opacity .25s ease;
}
.viewer.show-title .viewer-title { opacity: 1; }
.viewer-title .num { font-family: "Roboto", var(--font); } /* 빗금 없는 깔끔한 0 */
.viewer img {
  position: relative;
  display: block;
  transform-origin: 0 0;
  will-change: transform, opacity;   /* 움직임과 진하기 변화를 그래픽 처리로 (끊김 방지) */
}

/* Info: 가운데 위에 이름(위아래로), 그 밑에 이메일, 소개는 비워둠 */
.info {
  max-width: 640px;
  margin: 0 auto;
  padding: 120px 24px 80px;
  text-align: center;
}
.info.active { display: flex; flex-direction: column; align-items: center; gap: 28px; }
.info .head { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.info .name { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.04em; word-spacing: -0.15em; line-height: 1.2; } /* 고정폭 글꼴이라 기본 간격이 넓어서 좁힘 */
.info .meta { margin: 0; font-size: 15px; font-weight: 360; letter-spacing: -0.02em; word-spacing: -0.2em; }
.info .comma { margin-left: -0.2em; margin-right: -0.34em; } /* 쉼표 앞뒤 빈칸 줄이기 */
.info .num { font-family: "Roboto", var(--font); } /* 빗금 없는 0 */
/* 이메일 + 인스타그램: 화면 맨 아래 가운데 */
.info .foot {
  position: fixed;
  left: 50%;
  bottom: 72px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 14px;
  white-space: nowrap;
}
.info .email { margin: 0; font-size: 15px; font-weight: 430; letter-spacing: -0.02em; user-select: text; }
.info .insta { display: inline-flex; color: var(--black); font-size: 18px; line-height: 0; text-decoration: none; }
.info .insta svg, .info .insta i { width: 18px; height: 18px; }
.info .insta:hover { opacity: .6; }
.info .bio { margin: 12px 0 0; max-width: 34em; /* 두 문장이 이어져 3줄 정도로, 첫 줄이 길게 보이게 */ font-size: 15px; font-weight: 360; line-height: 1.75; letter-spacing: -0.02em; word-spacing: -0.2em; text-wrap: pretty; }

@media (max-width: 480px) {
  .rows { column-gap: 10px; row-gap: 14px; }
  .series::before { transform: translate(3px, -3px); }
  .series::after { transform: translate(6px, -6px); }
  .viewer { padding: 40px 12px 16px; } /* 휴대폰: 제목 자리만큼 위를 비움 */
  .drawing { padding: 120px 16px 60px; }
  .info { padding: 120px 16px 60px; }
}
</style>
</head>
<body class="is-home">

<nav class="menu" id="menu" aria-label="메뉴">
  <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="menu-list" aria-label="메뉴 열기">
    <svg class="star" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
      <path transform="translate(0 0.6)" d="M12 2.2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17.1l-6.1 3.5 1.5-6.8-5.2-4.6 6.9-.7z"

      <button type="button" class="work" data-title="Portrait 01" aria-label="Portrait 01 크게 보기"><img src="images/6.jpg" width="2072" height="2970" alt="Portrait 01"></button>

      <button type="button" class="work" style="--i: 1" data-title="Bust 02" aria-label="Bust 02 크게 보기"><img src="images/3.jpg" width="2292" height="3046" alt="Bust 02"></button>
      <button type="button" class="work" style="--i: 2" data-title="Bust 03" aria-label="Bust 03 크게 보기"><img src="images/4.jpg" width="1200" height="1600" alt="Bust 03"></button>

      <button type="button" class="work" style="--i: 0" data-title="Plein air 01" aria-label="Plein air 01 크게 보기"><img src="images/2.jpg" width="1170" height="1540" alt="Plein air 01"></button>
      <button type="button" class="work" style="--i: 1" data-title="Plein air 02" aria-label="Plein air 02 크게 보기"><img src="images/7.jpg" width="971" height="1258" alt="Plein air 02"></button>

    <p class="bio">From Seoul City<span class="comma">,</span> I mostly make two&#8209;dimensional works with ink and brush<span class="comma">,</span> and digital tools. I&nbsp;only gather and draw delicate<span class="comma">,</span> beautiful things.</p>

</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="그림 크게 보기" tabindex="-1">
  <div class="viewer-bg" id="viewer-bg"></div>
  <p class="viewer-title" id="viewer-title"></p>
  <img id="viewer-img" alt="">
</div>

<script>
const menu = document.getElementById("menu");
const toggle = document.getElementById("menu-toggle");

function setOpen(open) {
  menu.classList.toggle("open", open);
  toggle.setAttribute("aria-expanded", open);
}

// 별 한 바퀴: 첫 화면이 뜰 때만 핑 돎 (누를 때는 72도만 돌며 메뉴가 펼쳐짐)
function spinStar() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  toggle.getAnimations().forEach(a => a.cancel());
  toggle.animate(
    [{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }],
    { duration: 600, easing: "cubic-bezier(.4, 0, .2, 1)" }
  );
}
if (!location.hash || location.hash === "#") setTimeout(spinStar, 500);

// 첫 화면에 가만히 두면 3초마다 똑같이 한 바퀴 핑 돎 (만지거나 메뉴가 열려 있으면 쉼)
const IDLE_SPIN_MS = 3000;
let idleSpinTimer = 0;
function scheduleIdleSpin() {
  clearTimeout(idleSpinTimer);
  idleSpinTimer = setTimeout(() => {
    const home = !location.hash || location.hash === "#";
    if (home && !menu.classList.contains("open") && !document.hidden) spinStar();
    scheduleIdleSpin();
  }, IDLE_SPIN_MS);
}
["pointerdown", "keydown", "hashchange"].forEach(ev => window.addEventListener(ev, scheduleIdleSpin));
setTimeout(scheduleIdleSpin, 500);

toggle.addEventListener("click", () => setOpen(!menu.classList.contains("open")));

const viewer = document.getElementById("viewer");
const viewerImg = document.getElementById("viewer-img");
const viewerBg = document.getElementById("viewer-bg");
const viewerTitle = document.getElementById("viewer-title");
// 별이 돌며 메뉴가 펼쳐지는 움직임과 같은 시간·같은 곡선
const MOTION = { duration: 350, easing: "ease" };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
let lastWork = null, busy = false;

// 작은 그림 자리 → 크게 뜬 자리 사이의 차이를 transform으로 계산
// 미리보기는 잘린 상태라서, 큰 그림을 미리보기 칸만큼 줄이고 같은 부분만 보이게 잘라서 시작
function delta(from, to) {
  const s = Math.max(from.width / to.width, from.height / to.height);
  const ix = (to.width - from.width / s) / 2;   // 좌우로 가려지는 폭 (큰 그림 기준)
  const iy = (to.height - from.height / s) / 2; // 위아래로 가려지는 높이
  return {
    transform: `translate(${from.left - to.left - ix * s}px, ${from.top - to.top - iy * s}px) scale(${s})`,
    clipPath: `inset(${iy}px ${ix}px round ${THUMB_R / s}px)` // 미리보기의 둥근 모서리에서 시작
  };
}
const FULL = { transform: "none", clipPath: "inset(0px 0px round 0px)" };
const THUMB_R = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--thumb-radius")) || 0;

// 크게 볼 그림 크기를 화면에 맞춰 직접 계산 (이미지 로딩을 기다리지 않도록)
function fitViewer() {
  if (!lastWork) return;
  const t = lastWork.querySelector("img");
  const ratio = t.getAttribute("width") / t.getAttribute("height");
  const cs = getComputedStyle(viewer);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const w = Math.min(viewer.clientWidth - padX, (viewer.clientHeight - padY) * ratio);
  viewerImg.style.width = w + "px";
  viewerImg.style.height = w / ratio + "px";
  // 제목을 그림 왼쪽 위에 12px 띄워서 붙임
  const GAP = 9;   // 그림과의 간격 (낮을수록 그림에 가까움)
  viewerTitle.style.left = (viewerImg.offsetLeft + 7) + "px"; // 그림 끝보다 아주 살짝 안쪽
  viewerTitle.style.top = (viewerImg.offsetTop - viewerTitle.offsetHeight - GAP) + "px";
}
window.addEventListener("resize", () => { if (viewer.classList.contains("open")) { fitViewer(); if (typeof preparePeeks === "function" && !slide) preparePeeks(); } });

function setTitle(title) {
  viewerTitle.textContent = "";
  title.split(/(\d+)/).forEach(part => {
    if (!part) return;
    if (/^\d+$/.test(part)) {
      const n = document.createElement("span");
      n.className = "num";
      n.textContent = part;
      viewerTitle.appendChild(n);
    } else viewerTitle.appendChild(document.createTextNode(part));
  });
}

function openViewer(btn) {
  if (typeof resetZoom === "function") resetZoom(false);
  if (busy) return;
  const thumb = btn.querySelector("img");
  viewerImg.src = thumb.src;
  viewerImg.alt = thumb.alt;
  setTitle(btn.dataset.title);
  lastWork = btn;
  viewer.classList.add("open");
  fitViewer();
  if (typeof preloadNeighbors === "function") preloadNeighbors();
  viewer.focus({ preventScroll: true });
  if (reduceMotion.matches) { viewer.classList.add("show-title"); return; }

  busy = true;
  const from = thumb.getBoundingClientRect();
  const to = viewerImg.getBoundingClientRect();
  thumb.style.visibility = "hidden";
  viewerBg.animate([{ opacity: 0 }, { opacity: 1 }], MOTION);
  viewerImg.animate([delta(from, to), FULL], MOTION)
    .finished.then(() => {
      busy = false;
      viewer.classList.add("show-title"); // 그림이 다 커진 뒤 제목이 나타남
    });
}

function closeViewer() {
  if (!viewer.classList.contains("open") || busy) return;
  resetZoom(false);
  dropPeeks();
  const thumb = lastWork.querySelector("img");
  viewer.classList.remove("show-title"); // 제목이 먼저 사라짐
  viewer.blur();
  const done = () => {
    viewer.classList.remove("open");
    thumb.style.visibility = "";
    busy = false;
  };
  if (reduceMotion.matches) return done();

  busy = true;
  const from = thumb.getBoundingClientRect();
  const to = viewerImg.getBoundingClientRect();
  const opts = { ...MOTION, fill: "forwards" };
  viewerBg.animate([{ opacity: 1 }, { opacity: 0 }], opts);

  const r = draw.querySelector(`.series[href="#${id}"]`).getBoundingClientRect();
  draw.style.cssText = "";
  return r;
}
document.querySelectorAll(".series").forEach(link => {
  link.addEventListener("click", e => {
    e.preventDefault();
    if (seriesBusy) return;
    const id = link.getAttribute("href").slice(1);
    const cover = link.getBoundingClientRect();
    location.hash = id;
    route();
    if (reduceMotion.matches) return;
    const view = document.getElementById("view-" + id);
    view.classList.add("from-cover");
    seriesBusy = true;
    const tiles = [...view.querySelectorAll(".work")];
    const anims = tiles.map((t, i) => t.animate(
      [{ transform: toRect(t.getBoundingClientRect(), cover), opacity: i === 0 ? 1 : 0 },
       { transform: "none", opacity: 1 }],
      { ...SERIES_MOTION, delay: i * 40, fill: "backwards" }
    ));
    Promise.all(anims.map(a => a.finished)).finally(() => { seriesBusy = false; });
  });
});
function closeSeries() {
  const view = document.querySelector(".series-view.active");
  if (!view || seriesBusy) return;
  const id = view.id.replace("view-", "");
  const finish = () => {
    location.hash = "drawing";
    route();
    const draw = document.getElementById("view-drawing");
    const link = draw.querySelector(`.series[href="#${id}"]`);
    draw.classList.add("enter");
    link.classList.add("from");
    view.querySelectorAll(".work").forEach(t => t.getAnimations().forEach(a => a.cancel()));
    seriesBusy = false;
  };
  if (reduceMotion.matches) return finish();
  seriesBusy = true;
  const cover = coverRectFor(id);
  const tiles = [...view.querySelectorAll(".work")];
  const anims = tiles.map((t, i) => t.animate(
    [{ transform: "none", opacity: 1 },
     { transform: toRect(t.getBoundingClientRect(), cover), opacity: i === 0 ? 1 : 0 }],
    { ...SERIES_MOTION, fill: "forwards" }
  ));
  Promise.all(anims.map(a => a.finished)).then(finish);
}
// 시리즈 화면에서 그림 바깥 빈 곳을 누르면 Draw 화면으로 돌아감
document.addEventListener("click", e => {
  if (!document.querySelector(".series-view.active")) return;
  if (e.target.closest(".work, .menu, .viewer")) return;
  closeSeries();
});
window.addEventListener("hashchange", route);
route();
</script>
